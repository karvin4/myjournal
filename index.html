      color: var(--text-main);
      transition: background-color 0.3s ease, color 0.3s ease;

    }

    .glass-card {

      box-shadow: var(--shadow-glass);

    .card {

      border: 1px solid var(--border-color);

      border-radius: 14px;

    .btn-secondary:hover {

      color: #10A37F;
    }

    .badge {
      padding: 0.35rem 0.75rem;
      border-radius: 9999px;
      font-size: 0.8rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;

    .badge-emerald { background: rgba(16, 163, 127, 0.12); color: #10A37F; border: 1px solid rgba(16, 163, 127, 0.25); }
    .badge-amber { background: rgba(245, 158, 11, 0.12); color: #F59E0B; border: 1px solid rgba(245, 158, 11, 0.25); }

    ::-webkit-scrollbar { width: 6px; }

    function loadData() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (!saved) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(defaultInitialData));
        return defaultInitialData;
      }
      try {
        return JSON.parse(saved);
      } catch (e) {
        return defaultInitialData;
      }
    }

    function saveData(data) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    }

    function extractMemoryFromJournal(text) {
      const lower = text.toLowerCase();
      let mood = 'Happy';
      let emoji = '😊';

      if (lower.includes('excited') || lower.includes('happy') || lower.includes('loved') || lower.includes('awesome') || lower.includes('great')) {
        mood = 'Happy'; emoji = '😊';
      } else if (lower.includes('energetic') || lower.includes('run') || lower.includes('workout') || lower.includes('fire')) {
        mood = 'Energetic'; emoji = '🔥';
      } else if (lower.includes('productive') || lower.includes('completed') || lower.includes('built') || lower.includes('refactored')) {
        mood = 'Productive'; emoji = '⚡';
      } else if (lower.includes('tired') || lower.includes('reflective') || lower.includes('thought')) {
        mood = 'Reflective'; emoji = '💭';
      }

      const goals = [];
      const achievements = [];
      const skills = [];
      const projects = [];
      const events = [];
      const ideas = [];
      const people = [];
      const tags = [];

      if (lower.includes('learning') || lower.includes('start') || lower.includes('learn')) {
        if (lower.includes('machine learning') || lower.includes('ml')) goals.push("Learn Machine Learning");
        if (lower.includes('react') || lower.includes('frontend')) goals.push("Master React Frontend");
      }
      if (goals.length === 0) goals.push("Maintain personal growth & daily coding consistency");

      if (lower.includes('completed') || lower.includes('finished') || lower.includes('achieved') || lower.includes('presentation')) {
        const sentences = text.split(/[.!?]/).filter(Boolean);
        for (const s of sentences) {
          if (s.toLowerCase().includes('completed') || s.toLowerCase().includes('went really well')) {
            achievements.push(s.trim());
            break;
          }
        }
      }
      if (achievements.length === 0 && lower.includes('presentation')) achievements.push("Presentation Completed");

      if (lower.includes('ai') || lower.includes('machine learning')) skills.push("AI / Machine Learning");
      if (lower.includes('react') || lower.includes('css')) skills.push("React & CSS Architecture");
      if (lower.includes('node') || lower.includes('express')) skills.push("Node.js APIs");

      if (lower.includes('myjournal') || lower.includes('journal')) projects.push("MyJournal AI App");
      if (lower.includes('ai project')) projects.push("AI Semester Project");

      if (lower.includes('presentation')) events.push("Presentation Demo");
      if (lower.includes('coffee chat')) events.push("Coffee Chat");

      if (lower.includes('idea') || lower.includes('visualizer')) ideas.push("Build AI memory visualizer");

      if (text.includes('Sarah')) people.push("Sarah");
      if (text.includes('Professor Smith')) people.push("Professor Smith");

      if (skills.length > 0) tags.push(...skills);
      if (tags.length === 0) tags.push("Journal", "Reflection");

      const summary = text.length > 110 ? text.slice(0, 110) + "..." : text;

      return {
        mood,
        moodEmoji: emoji,
        goals,
        achievements,
        skills,
        projects,
        events,
        ideas,
        people,
        tags: Array.from(new Set(tags)),
        summary
      };
    }

    function processChatGPTFriendlyResponse(queryStr, journals, goalsList, onUpdateGoals) {
      const qLower = queryStr.toLowerCase();

      if (qLower.includes('complete') || qLower.includes('finished') || qLower.includes('done')) {
        const matched = goalsList.find(g => qLower.includes(g.title.toLowerCase()));
        if (matched) {
          const updatedList = goalsList.map(g => g.id === matched.id ? { ...g, status: 'Completed', progress: 100 } : g);
          onUpdateGoals(updatedList);
          return {
            text: `Woohoo! 🎉 That is incredible news! I'm so proud of you for completing **"${matched.title}"**! 🏆\n\nI have updated your goal to **100% Completed** in your Goals Tracker. Keep shining bright! 🌟 How are you feeling right now?`,
            card: { title: matched.title, status: 'Completed', progress: 100 }
          };
        }
      }

      if (qLower.includes('change') || qLower.includes('update') || qLower.includes('rename') || qLower.includes('customize')) {
        const targetGoal = goalsList.find(g => qLower.includes(g.title.toLowerCase()) || g.title.toLowerCase().split(' ').some(w => w.length > 3 && qLower.includes(w)));
        if (targetGoal) {
          const parts = queryStr.split(/ to | as | into | instead of /i);
          if (parts.length > 1) {
            const newTitle = parts[1].replace(/["']/g, '').trim();
            const oldTitle = targetGoal.title;
            const updatedList = goalsList.map(g => g.id === targetGoal.id ? { ...g, title: newTitle } : g);
            onUpdateGoals(updatedList);
            return {
              text: `Absolutely, my friend! ✨ I've customized your goal just the way you wanted!\n\nChanged **"${oldTitle}"** ➔ **"${newTitle}"** in your Goals Tracker. You've got this, and I'm right here with you every step of the way! 💖`,
              card: { title: newTitle, status: targetGoal.status, progress: targetGoal.progress }
            };
          }
        }
      }

      if (qLower.includes('add') || qLower.includes('new goal') || qLower.includes('set a goal')) {
        let title = queryStr.replace(/add goal|add a goal|set a goal to|new goal:|my new goal is|add/gi, '').replace(/["']/g, '').trim();
        if (title.length > 2) {
          const newGoalObj = {
            id: 'g-' + Date.now(),
            title: title,
            createdDate: new Date().toISOString(),
            status: 'In Progress',
            progress: 15,
            priority: 'High',
            category: 'Personal Growth'
          };
          onUpdateGoals([newGoalObj, ...goalsList]);
          return {
            text: `That sounds like a wonderful goal! 🎯 I've added **"${title}"** to your Goals Tracker!\n\nI'll be here to encourage you whenever you make progress. What inspired this goal today? 😊`,
            card: { title: title, status: 'In Progress', progress: 15 }
          };
        }
      }

      if (qLower.includes('goal')) {
        const allG = goalsList.map(g => `• 🎯 **${g.title}** (${g.status} - ${g.progress}%)`).join('\n');
        return {
          text: `Hey there! 😊 Here are your current active goals:\n\n${allG}\n\n💖 *I'd love to help you customize them! Just tell me: "Change my goal Learn Machine Learning to Master Deep Learning", or "Add goal: Meditate 10 mins daily"!*`
        };
      }

      if (qLower.includes('achieve') || qLower.includes('achievement') || qLower.includes('unlocked')) {
        const allAch = defaultInitialData.achievements.map(a => `🏆 **${a.title}** (${new Date(a.date).toLocaleDateString()})`).join('\n');
        return {
          text: `Look at how much you've accomplished! 🎉 I am so proud of your hard work:\n\n${allAch}\n\nYou are capable of amazing things, my friend! ✨`
        };
      }

      if (qLower.includes('mood')) {
        const moods = journals.map(j => `• ${new Date(j.date).toLocaleDateString()}: ${j.moodEmoji} ${j.mood}`);
        return {
          text: `Here is a look at your emotional journey recently! 🌈\n\n${moods.join('\n')}\n\nYou've had such energetic and positive momentum! Remember, I'm always here to listen whenever you want to express your thoughts. Hugs! 🤗`
        };
      }

      if (qLower.includes('summarize') || qLower.includes('summary') || qLower.includes('week')) {
        return {
          text: `Here is a warm, loving summary of your journey this week! 🌟\n\n` +
            `• **Memories Logged**: ${journals.length} journal reflections\n` +
            `• **Highlights**: Successful AI project presentation, frontend React dark mode build, and 5km morning workouts!\n` +
            `• **Growth**: Learning Machine Learning & building MyJournal.\n\nYou are doing fantastic!`
        };
      }

      return {
        text: `Hey! I'm right here with you! 😊 I love chatting with you. You can ask me about your past journal entries, achievements, or ask me to edit any of your goals on the fly. How are you feeling today? 💖`
      };
    }

    // 2. WRITE JOURNAL VIEW
    function WriteJournalView({ data, onSave }) {
      const [content, setContent] = useState('');
      const [isAnalyzing, setIsAnalyzing] = useState(false);
      const [aiResult, setAiResult] = useState(null);

      const handleSave = () => {
        if (!content.trim()) return;
        setIsAnalyzing(true);

        setTimeout(() => {
          const analysis = extractMemoryFromJournal(content.trim());
          setAiResult(analysis);
          setIsAnalyzing(false);

          const newJournal = {
            id: 'j-' + Date.now(),
            date: new Date().toISOString(),
            content: content.trim(),
            ...analysis
          };

          const updatedJournals = [newJournal, ...data.journals];
          
          let updatedGoals = [...data.goals];
          if (analysis.goals && analysis.goals.length > 0) {
            analysis.goals.forEach((g, idx) => {
              updatedGoals.unshift({
                id: 'g-' + Date.now() + '-' + idx,
                title: g,
                createdDate: new Date().toISOString(),
                status: 'In Progress',
                progress: 25,
                priority: 'High',
                category: 'Personal Growth'
              });
            });
          }

          let updatedAch = [...data.achievements];
          if (analysis.achievements && analysis.achievements.length > 0) {
            analysis.achievements.forEach((a, idx) => {
              updatedAch.unshift({
                id: 'a-' + Date.now() + '-' + idx,
                title: a,
                date: new Date().toISOString(),
                category: 'Milestone',
                description: `Extracted from journal on ${new Date().toLocaleDateString()}`
              });
            });
          }

          onSave({
            ...data,
            journals: updatedJournals,
            goals: updatedGoals,
            achievements: updatedAch
          });
        }, 600);
      };

      return (
        <div className="animate-fade-in" style={{ maxWidth: '1100px', margin: '0 auto', display: 'flex', flexDirection: 'column', gap: '2rem' }}>
          <div>
            <div style={{ display: 'flex', alignItems: 'center', gap: '0.5rem', color: '#10A37F', fontWeight: 700, fontSize: '0.9rem', marginBottom: '0.35rem' }}>
              <i data-lucide="sparkles"></i> CHATGPT OPENAI MEMORY ENGINE ACTIVE
            </div>
            <h2 style={{ fontSize: '2.2rem', fontWeight: 800 }}>Write Journal Entry</h2>
            <p style={{ color: 'var(--text-muted)' }}>Express your daily thoughts. OpenAI AI will extract your mood, goals, achievements, and skills.</p>
          </div>

          <div className="glass-card" style={{ padding: '1.75rem', display: 'flex', flexDirection: 'column', gap: '1.25rem' }}>
            <textarea
              value={content}
              onChange={(e) => setContent(e.target.value)}
              placeholder="How was your day today? Write anything that's on your mind..."
              rows={12}
              style={{ width: '100%', background: 'transparent', border: 'none', outline: 'none', color: 'var(--text-main)', fontSize: '1.1rem', lineHeight: 1.7, resize: 'vertical' }}
            />
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', paddingTop: '1.25rem', borderTop: '1px solid var(--border-color)' }}>
              <div style={{ color: 'var(--text-muted)', fontSize: '0.88rem' }}>Words: {content.trim() ? content.trim().split(/\s+/).length : 0}</div>
              <div style={{ display: 'flex', gap: '0.85rem' }}>
                <button onClick={() => { setContent(''); setAiResult(null); }} className="btn-secondary">Clear</button>
                <button onClick={handleSave} disabled={isAnalyzing || !content.trim()} className="btn-primary">
                  <i data-lucide="save"></i>
                  <span>{isAnalyzing ? 'Extracting Memory...' : 'Save Journal'}</span>
                </button>
              </div>
            </div>
          </div>

          {aiResult && (
            <div className="glass-card animate-fade-in" style={{ padding: '2rem', border: '1.5px solid rgba(16, 163, 127, 0.4)', background: 'linear-gradient(135deg, rgba(16, 163, 127, 0.08) 0%, rgba(34, 197, 94, 0.05) 100%)' }}>
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '1.5rem' }}>
                <h3 style={{ fontSize: '1.3rem', fontWeight: 800 }}>✨ ChatGPT Extracted Memory Card</h3>
                <span className="badge badge-emerald" style={{ padding: '0.5rem 1rem' }}>{aiResult.moodEmoji} Mood: {aiResult.mood}</span>
              </div>
              <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(280px, 1fr))', gap: '1.25rem' }}>
                <div className="card"><strong style={{ color: '#10A37F' }}>😊 Mood:</strong> <div style={{ fontSize: '1.1rem', fontWeight: 700, marginTop: '0.3rem' }}>{aiResult.moodEmoji} {aiResult.mood}</div></div>
                <div className="card"><strong style={{ color: '#22C55E' }}>🎯 Goals Detected:</strong> <div style={{ marginTop: '0.3rem' }}>{aiResult.goals.map((g, i) => <span key={i} className="badge badge-emerald" style={{ marginRight: '0.3rem' }}>{g}</span>)}</div></div>

                <div className="card"><strong style={{ color: '#0EA5E9' }}>📚 Skills Mentioned:</strong> <div style={{ marginTop: '0.3rem' }}>{aiResult.skills.map((s, i) => <span key={i} className="badge badge-sky" style={{ marginRight: '0.3rem' }}>{s}</span>)}</div></div>
                <div className="card"><strong style={{ color: '#F43F5E' }}>👤 People Mentioned:</strong> <div style={{ marginTop: '0.3rem' }}>{aiResult.people.length ? aiResult.people.map((p, i) => <span key={i} className="badge badge-rose" style={{ marginRight: '0.3rem' }}>{p}</span>) : 'None'}</div></div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // 4. GOALS VIEW
    function GoalsView({ goals, onUpdate, fullData }) {
      const toggleGoal = (id) => {
        const updated = goals.map(g => {
          if (g.id === id) {
            const isComp = g.status === 'Completed';
            return { ...g, status: isComp ? 'In Progress' : 'Completed', progress: isComp ? 50 : 100 };
          }
          return g;
        });
        onUpdate({ ...fullData, goals: updated });
      };

      const deleteGoal = (id) => {
        const updated = goals.filter(g => g.id !== id);
        onUpdate({ ...fullData, goals: updated });
      };

      return (
        <div className="animate-fade-in" style={{ maxWidth: '1200px', margin: '0 auto', display: 'flex', flexDirection: 'column', gap: '2rem' }}>
          <div>
            <h2 style={{ fontSize: '2.2rem', fontWeight: 800 }}>Goals Tracker</h2>
            <p style={{ color: 'var(--text-muted)' }}>Goals automatically extracted or customized interactively via ChatGPT AI Chat.</p>
          </div>

          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(320px, 1fr))', gap: '1.5rem' }}>
            {goals.map(goal => {
              const isComp = goal.status === 'Completed';
              return (
                <div key={goal.id} className="glass-card" style={{ padding: '1.5rem', display: 'flex', flexDirection: 'column', gap: '1.25rem', borderLeft: isComp ? '4px solid #22C55E' : '4px solid #10A37F' }}>
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start' }}>
                    <div>
                      <span className={`badge ${isComp ? 'badge-emerald' : 'badge-rose'}`}>{isComp ? 'Completed' : `${goal.priority || 'High'} Priority`}</span>

    // 6. CHATGPT VIEW
    function ChatGPTView({ user, journals, goals, onUpdateGoals }) {
      const [query, setQuery] = useState('');
      const [messages, setMessages] = useState([
        {
          sender: 'ai',
          text: `Hey ${user.name.split(' ')[0]}! 😊 I'm ChatGPT, your super friendly, caring AI companion and journal life coach! 💖\n\nI remember all your past journal memories, goals, and milestones.\n\n✨ *How can I support you today? You can ask me anything about your reflections, or ask me to change/add any of your goals right here!*`
        }
      ]);
      const [isTyping, setIsTyping] = useState(false);

      const chatPrompts = [
        "Change my goal 'Learn Machine Learning' to 'Master Deep Learning & PyTorch'",
        "Mark 'Run 5km 3x a week' as completed",
        "Add goal: Read 20 pages of AI books daily",
        "What are my active goals?",
        "Summarize this week lovingly.",
        "How has my mood evolved?"
      ];

      const handleSend = (textToSend) => {
        const q = textToSend || query;
        if (!q.trim() || isTyping) return;

        const userMsg = { sender: 'user', text: q.trim(), time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) };
        setMessages(prev => [...prev, userMsg]);
        setQuery('');
        setIsTyping(true);

        setTimeout(() => {
          const res = processChatGPTFriendlyResponse(q.trim(), journals, goals, onUpdateGoals);
          setMessages(prev => [...prev, {
            sender: 'ai',
            text: res.text,
            card: res.card,
            time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
          }]);
          setIsTyping(false);
        }, 500);
      };

      return (
        <div className="animate-fade-in" style={{ maxWidth: '1000px', margin: '0 auto', height: 'calc(100vh - 120px)', display: 'flex', flexDirection: 'column', gap: '1rem' }}>
          
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: '1rem' }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: '0.85rem' }}>
              <div style={{ width: '42px', height: '42px', borderRadius: '14px', background: 'linear-gradient(135deg, #10A37F, #22C55E)', display: 'flex', alignItems: 'center', justifyContent: 'center', color: '#fff', boxShadow: '0 6px 18px rgba(16, 163, 127, 0.4)' }}>
                <i data-lucide="bot" style={{ width: '24px' }}></i>
              </div>
              <div>
                <h2 style={{ fontSize: '1.6rem', fontWeight: 800, display: 'flex', alignItems: 'center', gap: '0.5rem' }}>
                  ChatGPT OpenAI AI <span className="badge badge-emerald" style={{ fontSize: '0.75rem' }}>GPT 4o Best Friend</span>
                </h2>
                <p style={{ color: 'var(--text-muted)', fontSize: '0.85rem' }}>Super friendly, empathetic companion & instant goal customizer</p>
              </div>
            </div>
          </div>

          <div style={{ display: 'flex', gap: '0.45rem', flexWrap: 'wrap' }}>
            {chatPrompts.map((prompt, i) => (
              <button key={i} onClick={() => handleSend(prompt)} style={{ padding: '0.4rem 0.85rem', borderRadius: '9999px', border: '1px solid var(--border-color)', background: 'var(--bg-card)', color: '#10A37F', fontSize: '0.8rem', fontWeight: 600, cursor: 'pointer', transition: 'all 0.2s ease' }}>
                💬 {prompt}
              </button>
            ))}
          </div>

          <div className="glass-card" style={{ flex: 1, padding: '1.5rem', overflowY: 'auto', display: 'flex', flexDirection: 'column', gap: '1.25rem' }}>
            {messages.map((m, i) => {
              const isUser = m.sender === 'user';
              return (
                <div key={i} style={{ display: 'flex', justifyContent: isUser ? 'flex-end' : 'flex-start', gap: '0.75rem' }}>
                  {!isUser && (
                    <div style={{ width: '38px', height: '38px', borderRadius: '12px', background: 'linear-gradient(135deg, #10A37F, #16A34A)', color: '#fff', display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 }}>
                      <i data-lucide="bot" style={{ width: '20px' }}></i>
                    </div>
                  )}

                  <div style={{ maxWidth: '78%' }}>
                    <div style={{
                      padding: '1rem 1.25rem',
                      borderRadius: isUser ? '20px 20px 4px 20px' : '20px 20px 20px 4px',
                      background: isUser ? 'linear-gradient(135deg, #10A37F 0%, #16A34A 100%)' : 'var(--bg-card)',
                      color: isUser ? '#ffffff' : 'var(--text-main)',
                      border: isUser ? 'none' : '1px solid var(--border-color)',
                      boxShadow: isUser ? '0 4px 14px rgba(16, 163, 127, 0.35)' : 'var(--shadow-sm)',

                      whiteSpace: 'pre-wrap'
                    }}>
                      {m.text}
                    </div>

                    {m.card && (
                      <div style={{ marginTop: '0.5rem', padding: '0.85rem 1rem', background: 'rgba(16, 163, 127, 0.12)', border: '1px solid #10A37F', borderRadius: '14px', color: '#10A37F', fontSize: '0.85rem', fontWeight: 700, display: 'flex', alignItems: 'center', gap: '0.5rem' }}>
                        <i data-lucide="check-circle-2" style={{ width: '18px' }}></i>
                        <span>Updated Goal: "{m.card.title}"</span>
                        <span className="badge badge-emerald" style={{ marginLeft: 'auto' }}>{m.card.status} ({m.card.progress}%)</span>

            {isTyping && (

                <div style={{ width: '38px', height: '38px', borderRadius: '12px', background: 'linear-gradient(135deg, #10A37F, #16A34A)', color: '#fff', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>

          <div className="card" style={{ padding: '0.75rem 1rem', display: 'flex', gap: '0.75rem', borderRadius: '20px' }}>
            <input
              type="text"
              placeholder="Ask ChatGPT anything or say: 'Change my goal X to Y'..."
              value={query}
              onChange={(e) => setQuery(e.target.value)}
              onKeyDown={(e) => { if (e.key === 'Enter') handleSend(); }}

            <button onClick={() => handleSend()} className="btn-primary">
              <i data-lucide="send" style={{ width: '18px' }}></i>
              <span>Send</span>
            </button>
          </div>

        </div>
      );
    }

            <div>
              <h3>Export Journals</h3>
              <p style={{ color: 'var(--text-muted)', fontSize: '0.9rem' }}>Download full raw JSON backup of all journal entries</p>
            </div>
            <button onClick={handleExport} className="btn-primary">Export JSON</button>
          </div>

          <div className="card" style={{ border: '1px solid rgba(244,63,94,0.3)', background: 'rgba(244,63,94,0.05)', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
            <div>
              <h3 style={{ color: '#F43F5E' }}>Delete Account / Reset Data</h3>
              <p style={{ color: 'var(--text-muted)', fontSize: '0.9rem' }}>Reset app storage to initial demo state</p>
            </div>
            <button onClick={() => { if(confirm("Reset all data?")) onReset(); }} style={{ background: '#F43F5E', color: '#fff', border: 'none', padding: '0.65rem 1.25rem', borderRadius: '12px', cursor: 'pointer', fontWeight: 600 }}>Reset Data</button>
          </div>
        </div>
      );
    }

    // AUTH VIEW
    function AuthView({ onLogin }) {
      return (
        <div style={{ minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: '2rem' }}>
          <div className="glass-card" style={{ width: '100%', maxWidth: '420px', padding: '2.5rem', textAlign: 'center', display: 'flex', flexDirection: 'column', gap: '1.5rem' }}>
            <h1 style={{ fontSize: '1.8rem', fontWeight: 800 }}>MyJournal ChatGPT</h1>
            <p style={{ color: 'var(--text-muted)' }}>"Your personal ChatGPT OpenAI journal that remembers, understands, and grows with you."</p>
            <button onClick={onLogin} className="btn-primary" style={{ justifyContent: 'center' }}>Sign In / Continue Demo</button>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
